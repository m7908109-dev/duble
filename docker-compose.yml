# ====================================================================
# Automatic Video Dubbing Engine — full stack (production)
#   backend  : Python FastAPI on :8000  (CPU-only friendly)
#   frontend : Next.js standalone  on :3000  (proxies /api/* to backend)
# ====================================================================
# Usage:
#   1) Set your Gemini key:  export GEMINI_API_KEY="..."
#   2) Build & run:          docker compose up --build -d
#   3) Open:                 http://localhost:3000
#
# Logs:   docker compose logs -f
# Stop:   docker compose down
# ====================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dubbing-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent job storage + SQLite DB (survives container restarts).
      - dubbing-storage:/app/storage
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - TTS_PROVIDER=${TTS_PROVIDER:-edge}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-fa-IR-DilaraNeural}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - MAX_VIDEO_DURATION_SECONDS=${MAX_VIDEO_DURATION_SECONDS:-0}
      - MAX_DOWNLOAD_MB=${MAX_DOWNLOAD_MB:-2048}
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_DIR=/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inside the compose network the frontend reaches the backend by name.
        BACKEND_URL: http://backend:8000
    container_name: dubbing-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

volumes:
  dubbing-storage:
